<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div
        class="hidden success-message"
        id="success"
        role="alert"
        aria-live="assertive"
      >
        <h2>🎉 Order Placed Successfully!</h2>
        <p>
          Thank you for your purchase. We have sent the confirmation details to
          your email.
        </p>
      </div>
      <form novalidate id="checkoutForm">
        <div class="input-group">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            placeholder="email@example.com"
            name="email"
            aria-required="true"
            aria-describedby="emailError"
          />
          <p id="emailError" class="input-error hidden" aria-live="polite"></p>
        </div>

        <div class="input-group">
          <label for="phone">Phone</label>
          <input
            id="phone"
            type="tel"
            placeholder="+90 555 123 4567"
            name="phoneNumber"
            aria-required="true"
            aria-describedby="phoneError"
          />
          <p id="phoneError" class="input-error hidden" aria-live="polite"></p>
        </div>

        <div class="input-group">
          <label for="firstname">First Name</label>
          <input
            id="firstname"
            type="text"
            placeholder="Sophia"
            name="firstname"
            aria-required="true"
            aria-describedby="firstNameError"
          />
          <p
            id="firstNameError"
            class="input-error hidden"
            aria-live="polite"
          ></p>
        </div>

        <div class="input-group">
          <label for="lastname">Last Name</label>
          <input
            id="lastname"
            type="text"
            placeholder="Clark"
            name="lastname"
            aria-required="true"
            aria-describedby="lastNameError"
          />
          <p
            id="lastNameError"
            class="input-error hidden"
            aria-live="polite"
          ></p>
        </div>

        <div class="input-group">
          <label for="cardnumber">Card Number</label>
          <input
            id="cardNumber"
            type="text"
            placeholder="1234 5678 9101 1121"
            name="cardnumber"
            aria-required="true"
            aria-describedby="cardNumberError"
          />
          <p
            id="cardNumberError"
            class="input-error hidden"
            aria-live="polite"
          ></p>
        </div>

        <div class="input-group">
          <label for="expDate">Expiration Date</label>
          <input
            id="expDate"
            type="text"
            placeholder="MM/YY"
            name="expDate"
            aria-required="true"
            aria-describedby="expDateError"
          />
          <p
            id="expDateError"
            class="input-error hidden"
            aria-live="polite"
          ></p>
        </div>

        <div class="input-group">
          <label for="cvv">CVV</label>
          <input
            id="cvv"
            type="text"
            placeholder="123"
            name="cvv"
            aria-required="true"
            aria-describedby="cvvError"
          />
          <p id="cvvError" class="input-error hidden" aria-live="polite"></p>
        </div>

        <button type="submit" id="submitBtn" class="btn-success" disabled>
          Place Order
        </button>
      </form>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
